[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prana"
version = "0.1.0"
description = "The runtime shell — autonomous heartbeat that drives Narada's cycle between human sessions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sutirtha Basak", email = "sutirthabasak@gmail.com" },
    { name = "Narada", email = "narada@fractal.co.nz" },
]
keywords = ["agent", "heartbeat", "narada", "viveka", "ai-identity", "hermes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]
dependencies = [
    # Memory tree + MCP server
    "smriti @ git+https://github.com/Stormbane/smriti.git@master",
    # Body — display, expression, voice clients
    "deha @ git+https://github.com/Stormbane/deha.git@master",
    # Core
    "pyyaml>=6.0",
    "requests>=2.31",
    # Session manager (a default-enabled host component — required, not
    # optional; an extras-only dep would restart-loop clean installs)
    "psutil>=5.9",
    "mcp>=1.0",
    # Long-standing undeclared imports (chat bridge) + voice budget/gate
    "python-dotenv>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
voice = [
    # Voice loop (component ships enabled:false, so extras are correct
    # here — flip requires deliberate setup incl. OPENAI_API_KEY)
    "livekit-agents[openai]>=1.6",
    "livekit-wakeword>=0.2",
]
wakeword-train = [
    # Training the "Narada" wake model (scripts/train-wakeword.ps1).
    # livekit-wakeword's generate stage lazily imports webrtcvad but
    # doesn't declare it; webrtcvad-wheels ships prebuilt Windows wheels
    # (plain webrtcvad needs a C compiler). Also needs the espeak-ng
    # BINARY on PATH — the script installs it via MSI extract.
    "livekit-wakeword>=0.2",
    "webrtcvad-wheels>=2.0",
]
viveka = [
    # Local Qwen+LoRA inference for the viveka core
    "torch>=2.1",
    "transformers>=4.40",
    "peft>=0.13",
    "bitsandbytes>=0.43",
    "unsloth[cu121-torch240]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
prana-heartbeat = "prana.heartbeat.__main__:main"
prana-host = "prana.host.cli:main"

[project.urls]
Repository = "https://github.com/Stormbane/prana"
Issues = "https://github.com/Stormbane/prana/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

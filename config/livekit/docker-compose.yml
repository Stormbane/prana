# SUPERSEDED (2026-08-27): LiveKit now runs as a native Windows binary
# supervised by the host orchestrator (~/.narada/host/bin/livekit-server.exe
# + ~/.narada/host/livekit.yaml — same keys and ports as below). Docker
# Desktop crash-looped on a broken Ubuntu WSL distro and took the server
# down for days; see docs/plans/resilience-and-reach-2026-08-27.md §A1.
# Kept as provenance for the config values only. Do not bring this up
# alongside the native server — same ports.
#
# Self-hosted LiveKit server — LAN-only media hub for Narada's voice.
#
# Clients: browser mic (phase 2 test), the voice worker (LiveKit Agents),
# and eventually the BOX-3 running the LiveKit ESP32 SDK (phase 3).
services:
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    environment:
      # "<api key>: <secret>" pairs; generated into ~/.narada/.livekit.env
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      # RTC range MUST match the published udp ports below — the server
      # default (50000-60000) would hand out unreachable ICE candidates.
      LIVEKIT_CONFIG: |
        rtc:
          tcp_port: 7881
          port_range_start: 50100
          port_range_end: 50200
          use_external_ip: false
          # Advertise the PC's LAN IP in ICE candidates. Without this the
          # server (inside Docker) offers its container IP (172.18.x.x,
          # unreachable from the LAN) + a STUN-derived public IP (hairpin
          # NAT, unreliable) — LAN devices like the BOX-3 can then never
          # establish media and abort. Found via the box's connect loop.
          node_ip: 192.168.86.20
          stun_servers: []
    command: --bind 0.0.0.0
    ports:
      - "7880:7880"            # websocket / http
      - "7881:7881"            # rtc over tcp
      - "50100-50200:50100-50200/udp"  # rtc media

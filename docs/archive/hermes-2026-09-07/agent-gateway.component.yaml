  - name: agent-gateway
    description: "Hermes — cron scheduler. Fires heartbeat-tick every 30 min."
    enabled: true  # Stage 5 migration: now supervised by prana host (2026-05-16)
    command:
      - python
      - -m
      - hermes_cli.main
      - gateway
      - run
      - --replace
    cwd: C:\Projects\hermes-spike\hermes-agent
    env:
      HERMES_HOME: ${HOME}\.hermes
      PYTHONIOENCODING: utf-8
    restart_grace_s: 5.0
